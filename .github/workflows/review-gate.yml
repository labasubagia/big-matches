name: Review gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review-gate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Block merge while review threads are unresolved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          repo="${{ github.repository }}"

          # pr-agent only runs on open/ready/review-requested/reopened.
          # On those events, wait for its check to exist and complete so
          # the threads it posts are present before we evaluate. On any
          # other event (push/synchronize) pr-agent does not run, so we
          # skip the wait entirely and just take a fresh snapshot.
          case "$PR_ACTION" in
            opened|ready_for_review|review_requested|reopened)
              for _ in $(seq 1 18); do
                statuses=$(gh pr checks "$PR_NUMBER" --json name,status \
                  -q '.[] | select((.name | ascii_downcase | (contains("pr-agent") or contains("pr agent")))) | .status' \
                  2>/dev/null || true)
                if [ -n "$statuses" ]; then
                  if ! printf '%s\n' "$statuses" | grep -qE 'queued|in_progress'; then
                    break
                  fi
                fi
                sleep 10
              done
              ;;
          esac

          out=$(gh api graphql \
            -F owner="${repo%/*}" -F name="${repo#*/}" -F number="$PR_NUMBER" \
            -f query='query ($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(first: 250) {
                    totalCount
                    nodes { isResolved }
                  }
                }
              }
            }' \
            -q '.data.repository.pullRequest.reviewThreads')
          total=$(printf '%s' "$out" | jq -r '.totalCount')
          unresolved=$(printf '%s' "$out" | jq '[.nodes[] | select(.isResolved == false)] | length')
          echo "total_threads=$total unresolved=$unresolved"
          if [ "$unresolved" -ne 0 ]; then
            echo "::error::Merge blocked: $unresolved unresolved review thread(s) remain."
            exit 1
          fi
          echo "All review threads resolved."
