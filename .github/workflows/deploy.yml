name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate static data (teams weekly, matches daily)
        run: npm run data:gen
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      - run: npm run build
        env:
          VITE_FIXTURES: production
          VITE_GITHUB_URL: https://github.com/${{ github.repository }}
      - run: cp dist/client/index.html dist/client/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@v4
  lighthouse:
    name: Lighthouse performance check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Lighthouse (perf >= 90 on deployed origin)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://${{ github.repository_owner }}.github.io/big-matches/
          runs: 3
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
