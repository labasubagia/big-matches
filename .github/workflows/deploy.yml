name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip scheduled deploy if already deployed via push
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          sha="${{ github.sha }}"
          count=0
          if count=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?event=push&head_sha=${sha}&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == env.WORKFLOW_NAME and (.status != "completed" or .conclusion == "success"))] | length'); then
            :
          else
            echo "Warning: could not query GitHub API; proceeding with scheduled deploy."
            count=0
          fi
          if [ "${count}" -gt 0 ]; then
            echo "Commit ${sha} already deployed (or in progress) via push; cancelling scheduled run."
            gh run cancel "${{ github.run_id }}"
          else
            echo "No push deploy for ${sha}; proceeding with scheduled deploy."
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Generate static data (teams weekly, matches daily)
        run: npm run data:gen
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      - name: Derive deployed site URL
        run: |
          echo "VITE_SITE_URL=https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          VITE_FIXTURES: production
          VITE_GITHUB_URL: https://github.com/${{ github.repository }}
      - run: cp dist/client/index.html dist/client/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@v5
  lighthouse:
    name: Lighthouse ${{ matrix.preset }} (all gates on all routes)
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: desktop
            settings: --collect.settings.preset=desktop
          - preset: mobile
            settings: --collect.settings.formFactor=mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Run Lighthouse (${{ matrix.preset }})
        run: |
          npx lhci autorun --config=./.lighthouserc.json \
            ${{ matrix.settings }} \
            --collect.url="${{ needs.deploy.outputs.page_url }}" \
            --collect.url="${{ needs.deploy.outputs.page_url }}teams/" \
            --collect.url="${{ needs.deploy.outputs.page_url }}faq/"
      - uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ matrix.preset }}
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: error
  lighthouse-summary:
    name: Post Lighthouse summary
    needs: lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: lighthouse-desktop
          path: /tmp/desktop-lhci
      - uses: actions/download-artifact@v8
        with:
          name: lighthouse-mobile
          path: /tmp/mobile-lhci
      - run: node scripts/lighthouse-summary.ts /tmp/desktop-lhci /tmp/mobile-lhci
