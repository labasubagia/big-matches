name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Generate static data (teams weekly, matches daily)
        run: npm run data:gen
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      - name: Derive deployed site URL
        run: |
          echo "VITE_SITE_URL=https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          VITE_FIXTURES: production
          VITE_GITHUB_URL: https://github.com/${{ github.repository }}
      - run: cp dist/client/index.html dist/client/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@v4
  lighthouse:
    name: Lighthouse ${{ matrix.preset }} (all gates on all routes)
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: desktop
            flags: LHCI_COLLECT__SETTINGS__PRESET=desktop
          - preset: mobile
            flags: LHCI_COLLECT__SETTINGS__FORMFACTOR=mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Run Lighthouse (${{ matrix.preset }})
        run: |
          ${{ matrix.flags }} \
            npx lhci autorun --config=./.lighthouserc.json \
            --collect.url="${{ needs.deploy.outputs.page_url }}" \
            --collect.url="${{ needs.deploy.outputs.page_url }}teams/" \
            --collect.url="${{ needs.deploy.outputs.page_url }}faq/"
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.preset }}
          path: .lighthouseci
          if-no-files-found: error
  lighthouse-summary:
    name: Post Lighthouse summary
    needs: lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lighthouse-desktop
          path: /tmp/desktop-lhci
      - uses: actions/download-artifact@v4
        with:
          name: lighthouse-mobile
          path: /tmp/mobile-lhci
      - run: node scripts/lighthouse-summary.ts /tmp/desktop-lhci /tmp/mobile-lhci
