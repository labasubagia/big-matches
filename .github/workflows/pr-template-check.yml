name: PR Template Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check required headings
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os, sys

          with open(os.environ["GITHUB_EVENT_PATH"]) as f:
              body = json.load(f)["pull_request"]["body"] or ""

          required = ["## Summary", "## Changes", "## Testing"]
          missing = [h for h in required if h not in body]

          if missing:
              print(f"Missing required heading(s): {', '.join(missing)}")
              sys.exit(1)

          print("All required headings present.")
          EOF
  lint-pr-title:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Conventional-Commits/action-commitlint@v1
        with:
          commitlint-rules: |
            {
              "header-max-length": [2, "always", 100],
              "subject-case": [2, "never", ["sentence-case", "start-case", "pascal-case", "upper-case"]],
              "type-case": [2, "always", "lower-case"],
              "type-empty": [2, "never"],
              "scope-empty": [1, "always"],
              "subject-empty": [2, "never"],
              "type-enum": [2, "always", ["feat", "fix", "chore", "docs", "test", "refactor", "style", "perf", "ci", "build", "revert"]]
            }
