name: PR Template Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check required headings
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os, sys

          with open(os.environ["GITHUB_EVENT_PATH"]) as f:
              body = json.load(f)["pull_request"]["body"] or ""

          required = ["## Summary", "## Changes", "## Testing"]
          missing = [h for h in required if h not in body]

          if missing:
              print(f"Missing required heading(s): {', '.join(missing)}")
              sys.exit(1)

          print("All required headings present.")
          EOF
  lint-pr-title:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Lint PR title
        run: |
          printf '%s' '${{ github.event.pull_request.title }}' | npx commitlint --verbose
