name: PR Agent

on:
  pull_request:
    types: [opened, ready_for_review, review_requested, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write
jobs:
  pr-agent:
    if: ((github.event_name != 'issue_comment' && github.event.pull_request.draft != true) || github.event.issue.pull_request) && (github.event.sender.type || 'User') != 'Bot'
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}-${{ github.event_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Validate required configuration
        env:
          API_URL: ${{ vars.OPENAI_COMPATIBLE_URL }}
          API_KEY: ${{ secrets.OPENAI_COMPATIBLE_KEY }}
        run: |
          if [[ -z "$API_URL" || -z "$API_KEY" ]]; then
            echo "::error::OPENAI_COMPATIBLE_URL variable and OPENAI_COMPATIBLE_KEY secret must be configured"
            exit 1
          fi
      - name: PR Agent
        uses: Codium-ai/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__API_BASE: ${{ vars.OPENAI_COMPATIBLE_URL }}
          OPENAI__KEY: ${{ secrets.OPENAI_COMPATIBLE_KEY }}
          CONFIG__MODEL: "${{ vars.PR_AGENT_MODEL || 'openai/mercury-3' }}"
          CONFIG__FALLBACK_MODELS: "[]"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "32000"
          CONFIG__OUTPUT_RUN_DETAILS: "true"
          CONFIG__OUTPUT_RUN_COST: "true"
          CONFIG__REACTION_ON_START: eyes
          CONFIG__RESPONSE_LANGUAGE: en-US
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: "false"
          GITHUB__PUBLISH_AS_CHECK_RUN: "true"
          PR_REVIEWER__INLINE_KEY_ISSUES: "true"
          PR_REVIEWER__PERSISTENT_INLINE_COMMENTS: "true"
          PR_REVIEWER__ENABLE_LARGE_PR_CHUNKING: "true"
          PR_REVIEWER__REQUIRE_MERGE_RECOMMENDATION: "true"
          PR_REVIEWER__REQUIRE_RISK_ASSESSMENT: "true"
          PR_REVIEWER__REQUIRE_PRIORITY_FILES: "true"
          PR_REVIEWER__REQUIRE_TODO_SCAN: "true"
          PR_REVIEWER__REQUIRE_FAILURE_MODES: "true"
          PR_REVIEWER__REQUIRE_SCORE_REVIEW: "true"
          PR_REVIEWER__REQUIRE_CAN_BE_SPLIT_REVIEW: "true"
          PR_REVIEWER__PUBLISH_OUTPUT_NO_SUGGESTIONS: "false"
          PR_CODE_SUGGESTIONS__COMMITTABLE_CODE_SUGGESTIONS: "true"
          PR_CODE_SUGGESTIONS__SUGGESTIONS_SCORE_THRESHOLD: "3"
          PR_CODE_SUGGESTIONS__DEMAND_CODE_SUGGESTIONS_SELF_REVIEW: "true"
          PR_CODE_SUGGESTIONS__PUBLISH_OUTPUT_NO_SUGGESTIONS: "false"
          PR_CODE_SUGGESTIONS__ENABLE_CHAT_TEXT: "true"
          PR_DESCRIPTION__GENERATE_AI_TITLE: "false"
          PR_DESCRIPTION__PUBLISH_LABELS: "true"
