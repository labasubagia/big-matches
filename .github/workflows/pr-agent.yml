name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read

jobs:
  pr-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR Agent
        uses: codiumai/pr-agent@v0
        env:
          OPENAI__API_BASE: ${{ vars.OPENAI_COMPATIBLE_URL }}
          OPENAI__KEY: ${{ secrets.OPENAI_COMPATIBLE_KEY }}
